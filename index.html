<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge &#8212; Studio de Prompts & Specs IA</title>
<style>
  :root {
    --ground: #EDF0EF;
    --surface: #FFFFFF;
    --surface-2: #F5F7F6;
    --ink: #0E1A19;
    --ink-2: #3A4C4A;
    --muted: #6B7B79;
    --line: #D7DEDC;
    --line-strong: #BCC7C5;
    --accent: #0C6B63;
    --accent-ink: #085049;
    --accent-wash: #E0EDEB;
    --on-accent: #FFFFFF;
    --brass: #8A6210;
    --brass-wash: #F3EBD9;
    --s-idee: #5D6E93;
    --s-cours: #0C6B63;
    --s-pause: #8A6210;
    --s-fini: #3E7431;
    --danger: #A33124;
    --shadow: 0 1px 2px rgba(14,26,25,.05), 0 8px 24px -12px rgba(14,26,25,.18);
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --r: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0C1312;
      --surface: #141D1C;
      --surface-2: #1A2523;
      --ink: #E4EBE9;
      --ink-2: #B4C2BF;
      --muted: #869492;
      --line: #26312F;
      --line-strong: #35443F;
      --accent: #4FBFAF;
      --accent-ink: #7FD6C8;
      --accent-wash: #16302D;
      --on-accent: #06201D;
      --brass: #C79B3E;
      --brass-wash: #2C2517;
      --s-idee: #8FA1C7;
      --s-cours: #4FBFAF;
      --s-pause: #C79B3E;
      --s-fini: #79B267;
      --danger: #E0806F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 14.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::placeholder { color: var(--muted); opacity: .75; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: var(--display); font-size: 22px; font-weight: 600;
    margin: 0; letter-spacing: -.01em; color: var(--ink);
  }
  .brand .tag {
    margin: 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .anvil { width: 24px; height: 20px; flex: none; color: var(--accent); }
  .stats {
    display: flex; gap: 16px; flex-wrap: wrap; margin-right: auto;
    font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--ink); font-weight: 600; }
  .bar-actions { display: flex; gap: 8px; align-items: center; }

  .search {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-strong); border-radius: var(--r);
    background: var(--surface-2); padding: 0 9px; height: 32px;
  }
  .search input { border: 0; background: none; width: 160px; font-size: 13px; }
  .search input:focus { outline: none; }
  .search svg { width: 13px; height: 13px; color: var(--muted); flex: none; }

  .btn {
    height: 32px; padding: 0 12px; border-radius: var(--r); cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface);
    font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted); }
  .btn-primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--on-accent); font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn-ghost { border-color: transparent; background: none; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger:hover { color: var(--danger); border-color: var(--danger); background: none; }

  /* ---------- layout ---------- */
  .panes { display: grid; grid-template-columns: minmax(310px, 370px) 1fr; flex: 1; min-height: 0; }
  .listpane {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line); background: var(--ground);
  }
  .filters {
    display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  .chip {
    border: 1px solid var(--line-strong); background: transparent; cursor: pointer;
    border-radius: 100px; padding: 3px 9px; font-size: 11.5px; color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chip .n { font-family: var(--mono); font-size: 10px; opacity: .75; }

  .list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  .card {
    width: 100%; text-align: left; cursor: pointer; display: block;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 13px; margin-bottom: 6px;
    position: relative; overflow: hidden;
    transition: border-color .12s;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--fmt-color, var(--accent));
  }
  .card:hover { border-color: var(--line-strong); }
  .card[aria-current="true"] { border-color: var(--accent); background: var(--accent-wash); }
  .card-top { display: flex; align-items: baseline; gap: 8px; }
  .card-name {
    font-family: var(--display); font-size: 15.5px; font-weight: 600;
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .card-desc { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .pill {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    color: var(--fmt-color, var(--ink)); border: 1px solid currentColor; opacity: .9;
  }
  .tag-var {
    font-family: var(--mono); font-size: 10px; background: var(--surface-2); color: var(--muted);
    padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line);
  }

  /* ---------- studio detail ---------- */
  .detail { overflow-y: auto; background: var(--surface); min-height: 0; }
  .detail-inner { max-width: 820px; padding: 24px 32px 80px; }
  .blank {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; color: var(--muted); padding: 30px;
  }
  .blank h2 { font-family: var(--display); font-size: 22px; color: var(--ink); margin: 0; font-weight: 600; }
  .blank p { margin: 0; max-width: 44ch; font-size: 14px; line-height: 1.6; }

  .d-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .name-input {
    font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -.015em;
    border: 0; background: none; width: 100%; padding: 0 0 4px; margin: 0;
    border-bottom: 1px solid transparent;
  }
  .name-input:focus { outline: none; border-bottom-color: var(--accent); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .sel {
    height: 30px; border-radius: var(--r); border: 1px solid var(--line-strong);
    background: var(--surface-2); padding: 0 8px; font-size: 12.5px; cursor: pointer;
  }
  .token-badge {
    font-family: var(--mono); font-size: 11px; background: var(--accent-wash); color: var(--accent-ink);
    padding: 3px 8px; border-radius: 4px; font-weight: 600; margin-left: auto;
  }

  .block { margin-bottom: 22px; }
  .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); display: block; margin-bottom: 7px; font-weight: 600;
  }
  textarea.field, input.field {
    width: 100%; border: 1px solid var(--line); background: var(--surface-2);
    border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; resize: vertical;
    font-family: var(--body);
  }
  textarea.field.mono { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  textarea.field:focus, input.field:focus { border-color: var(--accent); background: var(--surface); }

  .vars-container {
    border: 1px solid var(--accent); background: var(--accent-wash);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 22px;
  }
  .vars-title { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .var-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .var-field-group label { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--accent-ink); margin-bottom: 3px; font-weight: 600; }
  .var-field-group input {
    width: 100%; border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 4px; padding: 5px 8px; font-size: 12.5px; font-family: var(--body);
  }
  .var-field-group input:focus { border-color: var(--accent); outline: none; }

  .preview-box {
    border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 8px;
    padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; color: var(--ink-2); max-height: 320px; overflow-y: auto;
  }

  .d-foot { display: flex; gap: 10px; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--ground); padding: 8px 18px; border-radius: 100px;
    font-size: 13px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50; font-family: var(--mono);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { display: none; }

  @media (max-width: 900px) {
    .panes { grid-template-columns: 1fr; }
    .detail { display: none; }
    .app.open .listpane { display: none; }
    .app.open .detail { display: block; }
    .back { display: inline-flex; }
    .detail-inner { padding: 18px 18px 70px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="anvil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12h20M7 12V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v5M5 12v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
      </svg>
      <h1>PromptForge</h1>
      <p class="tag">Studio Specs IA</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="bar-actions">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Rechercher une spec&#8230;" aria-label="Rechercher">
      </label>
      <button class="btn" id="btn-export" title="Exporter une sauvegarde de tes specs">Exporter JSON</button>
      <button class="btn" id="btn-import" title="Recharger une sauvegarde">Importer JSON</button>
      <button class="btn btn-primary" id="btn-new">+ Nouvelle Spec</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="panes">
    <section class="listpane">
      <div class="filters" id="filters"></div>
      <ul class="list" id="list"></ul>
    </section>
    <section class="detail" id="detail"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var KEY = "promptforge.specs.v1";

  var FORMATS = [
    { id: "claude-md", nom: "CLAUDE.md", ext: ".md", color: "#0C6B63" },
    { id: "agents-md", nom: "AGENTS.md", ext: ".md", color: "#5D6E93" },
    { id: "cursorrules", nom: ".cursorrules", ext: "", color: "#7E5DA8" },
    { id: "system-prompt", nom: "System Prompt", ext: ".txt", color: "#C56B3E" },
    { id: "json-spec", nom: "JSON Spec", ext: ".json", color: "#3E7431" }
  ];

  var MODELS = [
    { id: "claude-3-7-sonnet", nom: "Claude 3.7 / 3.5 Sonnet", rate: 0.0030, ratio: 3.7 },
    { id: "claude-3-5-haiku", nom: "Claude 3.5 Haiku", rate: 0.0008, ratio: 3.8 },
    { id: "gpt-4o", nom: "GPT-4o", rate: 0.0025, ratio: 3.7 },
    { id: "gpt-4o-mini", nom: "GPT-4o-mini", rate: 0.00015, ratio: 3.8 },
    { id: "gemini-2-flash", nom: "Gemini 2.0 Flash", rate: 0.00010, ratio: 4.0 },
    { id: "gemini-1-5-pro", nom: "Gemini 1.5 Pro", rate: 0.00125, ratio: 3.9 },
    { id: "deepseek-r1", nom: "DeepSeek R1 / V3", rate: 0.00014, ratio: 3.8 }
  ];

  var PRESETS = [
    {
      id: "preset-architect",
      nom: "Master Spec Agent (CLAUDE.md / AGENTS.md)",
      format: "claude-md",
      description: "Sp\u00e9cification d'architecture et consignes de code pour les agents IA.",
      template: "# Projet {{nom_projet}}\n\n## Vision & Objectif\n{{objectif_projet}}\n\n## Stack Technique\n- Langage & Framework : {{stack_technique}}\n- Style CSS : {{style_css}}\n\n## Directives Strictes pour l'Agent IA\n- Toujours respecter la structure du codebase existant.\n- V\u00e9rifier les lints et la syntaxe avant d'achever une t\u00e2che.\n- Ne jamais supprimer de code ou d'assertions sans autorisation.\n\n## Commandes de V\u00e9rification\n```bash\n{{commande_test}}\n```",
      values: { nom_projet: "MonProjet", objectif_projet: "Cr\u00e9er une webapp ultra rapide et \u00e9l\u00e9gante", stack_technique: "HTML5, Vanilla JS", style_css: "Vanilla CSS Tokens", commande_test: "npm test" }
    },
    {
      id: "preset-refactor",
      nom: "Agent Expert Refactoring & Code Clean",
      format: "system-prompt",
      description: "Prompt syst\u00e8me pour r\u00e9organiser et optimiser du code legacy.",
      template: "Tu es un expert en refactoring et architecture propre.\n\nContexte :\nAnalyse le code source du composant {{nom_composant}}.\n\nObjectif :\n1. Simplifier la fonction {{nom_fonction}}.\n2. \u00c9liminer la duplication de code sans modifier l'API publique.\n3. Ajouter de la gestion d'erreurs robuste.\n\nContraintes :\n- Conserver la r\u00e9trocompatibilit\u00e9.\n- Ne pas ajouter de d\u00e9pendances externes.",
      values: { nom_composant: "UserProfile", nom_fonction: "renderUserData" }
    },
    {
      id: "preset-ui-design",
      nom: "Agent Design System & UI Craft",
      format: "system-prompt",
      description: "Prompt pour la cr\u00e9ation d'interfaces au style \u00c9ditorial Minimaliste.",
      template: "Cr\u00e9e un composant UI {{type_composant}} en respectant le design system \u00c9ditorial Minimaliste.\n\nContraintes d'Aesthetique :\n- Titres en Serif (`Iowan Old Style`, Georgia).\n- M\u00e9tadonn\u00e9es et badges en Monospace (`SF Mono`, uppercase).\n- Couleurs terreuses : Fond `#EDF0EF`, Texte `#0E1A19`, Accent \u00c9meraude `#0C6B63`.\n- Support automatique du dark mode via `prefers-color-scheme`.",
      values: { type_composant: "Carte de Statistiques" }
    }
  ];

  var state = {
    specs: [], sel: null, filtreFmt: "tous", q: "", modelId: "claude-3-7-sonnet"
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getFmt(id) { for (var i = 0; i < FORMATS.length; i++) if (FORMATS[i].id === id) return FORMATS[i]; return FORMATS[0]; }
  function getModel(id) { for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === id) return MODELS[i]; return MODELS[0]; }
  function getSpec(id) { for (var i = 0; i < state.specs.length; i++) if (state.specs[i].id === id) return state.specs[i]; return null; }

  var toastT;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("on"); }, 2600);
  }

  function charger() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.specs) && d.specs.length > 0) {
          state.specs = d.specs;
          return;
        }
      }
    } catch (e) {}
    // Premier d\u00e9marrage : charger les presets
    state.specs = PRESETS.map(function (p) {
      return {
        id: p.id, nom: p.nom, format: p.format, description: p.description,
        template: p.template, values: p.values || {}, majLe: new Date().toISOString()
      };
    });
    sauver();
  }
  function sauver() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, specs: state.specs })); }
    catch (e) { toast("Sauvegarde impossible dans le navigateur."); }
  }

  function detectVars(tpl) {
    var re = /\{\{([a-zA-Z0-9_]+)\}\}/g;
    var match, vars = [], seen = {};
    while ((match = re.exec(tpl || "")) !== null) {
      if (!seen[match[1]]) { seen[match[1]] = true; vars.push(match[1]); }
    }
    return vars;
  }

  function compileSpec(spec) {
    var tpl = spec.template || "";
    var vals = spec.values || {};
    return tpl.replace(/\{\{([a-zA-Z0-9_]+)\}\}/g, function (m, key) {
      return vals[key] !== undefined && vals[key] !== "" ? vals[key] : "{{" + key + "}}";
    });
  }

  function countTokens(str, modelId) {
    if (!str) return 0;
    var m = getModel(modelId || state.modelId);
    return Math.ceil(str.length / m.ratio);
  }

  function calcCost(tokens, modelId) {
    var m = getModel(modelId || state.modelId);
    var cost = (tokens / 1000) * m.rate;
    if (cost < 0.0001 && cost > 0) return "<$0.0001";
    return "$" + cost.toFixed(4);
  }

  function meFiltrees() {
    var q = state.q.trim().toLowerCase();
    return state.specs.filter(function (s) {
      if (state.filtreFmt !== "tous" && s.format !== state.filtreFmt) return false;
      if (!q) return true;
      var blob = (s.nom + " " + s.description + " " + s.template + " " + getFmt(s.format).nom).toLowerCase();
      return blob.indexOf(q) !== -1;
    }).sort(function (a, b) { return new Date(b.majLe) - new Date(a.majLe); });
  }

  function renderStats() {
    var total = state.specs.length;
    var totalTokens = 0;
    state.specs.forEach(function (s) { totalTokens += countTokens(compileSpec(s)); });
    var h = "<span><b>" + total + "</b> spec" + (total > 1 ? "s" : "") + "</span>" +
            "<span>~<b>" + totalTokens.toLocaleString("fr-FR") + "</b> tokens au total</span>";
    document.getElementById("stats").innerHTML = h;
  }

  function renderFiltres() {
    var f = document.getElementById("filters");
    var compte = {};
    state.specs.forEach(function (s) { compte[s.format] = (compte[s.format] || 0) + 1; });

    var h = "<button class='chip' data-fmt='tous' aria-pressed='" + (state.filtreFmt === "tous") + "'>Tous <span class='n'>" + state.specs.length + "</span></button>";
    FORMATS.forEach(function (fmt) {
      var n = compte[fmt.id] || 0;
      if (!n && state.filtreFmt !== fmt.id) return;
      h += "<button class='chip' data-fmt='" + fmt.id + "' aria-pressed='" + (state.filtreFmt === fmt.id) + "'>" + fmt.nom + " <span class='n'>" + n + "</span></button>";
    });
    f.innerHTML = h;
  }

  function renderListe() {
    var ul = document.getElementById("list");
    var items = meFiltrees();
    if (!items.length) {
      ul.innerHTML = "<li style='padding:30px 20px; text-align:center; color:var(--muted); font-size:13px;'>Aucune spec trouvée.<br>Cliquez sur « + Nouvelle Spec ».</li>";
      return;
    }
    ul.innerHTML = items.map(function (s) {
      var fmt = getFmt(s.format);
      var vars = detectVars(s.template);
      var compiled = compileSpec(s);
      var tok = countTokens(compiled);
      return "<li><button class='card' data-id='" + s.id + "' aria-current='" + (state.sel === s.id) + "' style='--fmt-color:" + fmt.color + "'>" +
        "<div class='card-top'>" +
          "<span class='card-name'>" + (esc(s.nom) || "Sans titre") + "</span>" +
        "</div>" +
        "<div class='card-meta'>" +
          "<span class='pill' style='--fmt-color:" + fmt.color + "'>" + esc(fmt.nom) + "</span>" +
          "<span class='tag-var'>~" + tok + " tok</span>" +
          (vars.length ? "<span class='tag-var'>" + vars.length + " var" + (vars.length > 1 ? "s" : "") + "</span>" : "") +
        "</div>" +
        (s.description ? "<div class='card-desc'>" + esc(s.description) + "</div>" : "") +
      "</button></li>";
    }).join("");
  }

  function renderDetail() {
    var d = document.getElementById("detail");
    var s = getSpec(state.sel);
    if (!s) {
      d.innerHTML = "<div class='blank'>" +
        "<h2>Studio de Specs IA</h2>" +
        "<p>S\u00e9lectionnez un mod\u00e8le de prompt \u00e0 gauche ou cr\u00e9ez-en un nouveau. PromptForge d\u00e9tectera automatiquement les variables <code>{{variable}}</code> pour g\u00e9n\u00e9rer des formulaires dynamiques.</p>" +
        "</div>";
      return;
    }

    var fmt = getFmt(s.format);
    var vars = detectVars(s.template);
    var compiled = compileSpec(s);
    var tok = countTokens(compiled, state.modelId);
    var costStr = calcCost(tok, state.modelId);
    var curModel = getModel(state.modelId);

    var h = "<div class='detail-inner'>";
    h += "<div class='d-head'><button class='btn btn-ghost back' id='back'>\u2190 Liste</button></div>";
    h += "<input class='name-input' id='f-nom' value='" + esc(s.nom) + "' placeholder='Nom de la spec (ex: Spec Claude Code)' aria-label='Nom'>";

    h += "<div class='row'>";
    h += "<select class='sel' id='f-format' aria-label='Format'>" + FORMATS.map(function (f) {
      return "<option value='" + f.id + "'" + (s.format === f.id ? " selected" : "") + ">" + f.nom + "</option>";
    }).join("") + "</select>";

    h += "<select class='sel' id='f-model' aria-label='Mod\u00e8le IA'>" + MODELS.map(function (m) {
      return "<option value='" + m.id + "'" + (state.modelId === m.id ? " selected" : "") + ">" + m.nom + " ($" + (m.rate*1000).toFixed(2) + "/1M tok)</option>";
    }).join("") + "</select>";

    h += "<span class='token-badge'>~" + tok.toLocaleString("fr-FR") + " tokens (" + costStr + ")</span>";
    h += "</div>";

    h += "<div class='block'><label class='lbl' for='f-desc'>Description / Usage</label>" +
         "<input class='field' id='f-desc' value='" + esc(s.description) + "' placeholder='A quoi sert cette spec...'></div>";

    h += "<div class='block'><label class='lbl' for='f-tpl'>Mod\u00e8le de Spec (utilisez {{variable}} pour rendre dynamique)</label>" +
         "<textarea class='field mono' id='f-tpl' rows='9' placeholder='R\u00e9digez votre prompt avec des {{variables}}...'>" + esc(s.template) + "</textarea></div>";

    if (vars.length > 0) {
      h += "<div class='vars-container'><div class='vars-title'><span>Formulaire Dynamique de Variables (" + vars.length + ")</span></div>" +
           "<div class='var-grid'>" + vars.map(function (v) {
             var val = (s.values && s.values[v] !== undefined) ? s.values[v] : "";
             return "<div class='var-field-group'><label for='v-" + esc(v) + "'>{{" + esc(v) + "}}</label>" +
                    "<input id='v-" + esc(v) + "' data-var='" + esc(v) + "' value='" + esc(val) + "' placeholder='Valeur pour " + esc(v) + "'></div>";
           }).join("") + "</div></div>";
    }

    h += "<div class='block'><span class='lbl'>Aper\u00e7u Compil\u00e9 du Prompt Final</span>" +
         "<div class='preview-box' id='preview-box'>" + esc(compiled) + "</div></div>";

    h += "<div class='d-foot'>" +
      "<button class='btn btn-primary' id='btn-copy-compiled'>Copier le Prompt Compil\u00e9</button>" +
      "<button class='btn' id='btn-export-file'>T\u00e9l\u00e9charger le Fichier (" + esc(fmt.nom) + ")</button>" +
      "<button class='btn btn-ghost btn-danger' id='btn-suppr' style='margin-left:auto'>Supprimer</button>" +
      "</div></div>";

    d.innerHTML = h;
    d.scrollTop = 0;
    brancherDetail(s);
  }

  function brancherDetail(s) {
    var nom = document.getElementById("f-nom");
    if (nom) nom.addEventListener("input", function () { s.nom = nom.value; s.majLe = new Date().toISOString(); sauver(); renderListe(); });

    var fmt = document.getElementById("f-format");
    if (fmt) fmt.addEventListener("change", function () { s.format = this.value; s.majLe = new Date().toISOString(); sauver(); renderListe(); renderDetail(); });

    var mod = document.getElementById("f-model");
    if (mod) mod.addEventListener("change", function () {
      state.modelId = this.value;
      updatePreview(s);
      renderStats();
    });

    var desc = document.getElementById("f-desc");
    if (desc) desc.addEventListener("input", function () { s.description = desc.value; s.majLe = new Date().toISOString(); sauver(); renderListe(); });

    var tpl = document.getElementById("f-tpl");
    if (tpl) tpl.addEventListener("input", function () {
      s.template = tpl.value;
      s.majLe = new Date().toISOString();
      sauver();
      // Si la liste des variables change, on raffraichit le d\u00e9tail complet, sinon juste l'aper\u00e7u
      var newVars = detectVars(tpl.value);
      var oldVars = Object.keys(s.values || {});
      if (newVars.join(",") !== oldVars.join(",")) {
        renderDetail();
      } else {
        updatePreview(s);
      }
      renderListe(); renderStats();
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-var]"), function (inp) {
      inp.addEventListener("input", function () {
        var key = inp.getAttribute("data-var");
        s.values = s.values || {};
        s.values[key] = inp.value;
        sauver();
        updatePreview(s);
      });
    });

    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () { document.getElementById("app").classList.remove("open"); });

    document.getElementById("btn-copy-compiled").addEventListener("click", function () {
      var compiled = compileSpec(s);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(compiled).then(function () {
          toast("Prompt compil\u00e9 copi\u00e9 dans le presse-papier !");
        });
      }
    });

    document.getElementById("btn-export-file").addEventListener("click", function () {
      var compiled = compileSpec(s);
      var fmtInfo = getFmt(s.format);
      var fname = (s.nom || "spec").toLowerCase().replace(/[^a-z0-9]/g, "-") + fmtInfo.ext;
      if (fmtInfo.id === "claude-md") fname = "CLAUDE.md";
      else if (fmtInfo.id === "agents-md") fname = "AGENTS.md";
      else if (fmtInfo.id === "cursorrules") fname = ".cursorrules";

      var blob = new Blob([compiled], { type: "text/plain;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Fichier " + fname + " t\u00e9l\u00e9charg\u00e9.");
    });

    document.getElementById("btn-suppr").addEventListener("click", function () {
      if (!confirm("Supprimer la spec \u00ab " + (s.nom || "Sans titre") + " \u00bb ?")) return;
      state.specs = state.specs.filter(function (x) { return x.id !== s.id; });
      state.sel = null; sauver();
      document.getElementById("app").classList.remove("open");
      renderListe(); renderStats(); renderFiltres(); renderDetail();
      toast("Spec supprim\u00e9e.");
    });
  }

  function updatePreview(s) {
    var compiled = compileSpec(s);
    var pb = document.getElementById("preview-box");
    if (pb) pb.textContent = compiled;
    var m = getModel(state.modelId);
    var tok = countTokens(compiled, state.modelId);
    var costStr = calcCost(tok, state.modelId);
    var tb = document.querySelector(".token-badge");
    if (tb) tb.textContent = "~" + tok.toLocaleString("fr-FR") + " tokens (" + costStr + " - " + m.nom + ")";
  }

  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-fmt]"); if (!b) return;
    state.filtreFmt = b.getAttribute("data-fmt");
    renderFiltres(); renderListe();
  });

  document.getElementById("list").addEventListener("click", function (e) {
    var c = e.target.closest(".card"); if (!c) return;
    state.sel = c.getAttribute("data-id");
    document.getElementById("app").classList.add("open");
    renderListe(); renderDetail();
  });

  document.getElementById("q").addEventListener("input", function () {
    state.q = this.value; renderListe();
  });

  document.getElementById("btn-new").addEventListener("click", function () {
    var s = {
      id: uid(), nom: "Nouvelle Spec Agent", format: "claude-md",
      description: "", template: "# Spec pour {{agent_role}}\n\n## Directives\n- {{directive_1}}",
      values: { agent_role: "MonAgent", directive_1: "Format propre" }, majLe: new Date().toISOString()
    };
    state.specs.unshift(s);
    state.sel = s.id; state.filtreFmt = "tous"; state.q = "";
    document.getElementById("q").value = "";
    document.getElementById("app").classList.add("open");
    sauver(); renderStats(); renderFiltres(); renderListe(); renderDetail();
    var n = document.getElementById("f-nom"); if (n) n.focus();
  });

  document.getElementById("btn-export").addEventListener("click", function () {
    var data = JSON.stringify({ v: 1, specs: state.specs }, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "promptforge-specs.json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Sauvegarde JSON téléchargée.");
  });

  document.getElementById("btn-import").addEventListener("click", function () { document.getElementById("file").click(); });
  document.getElementById("file").addEventListener("change", function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        if (d && Array.isArray(d.specs)) {
          state.specs = d.specs;
          sauver(); renderStats(); renderFiltres(); renderListe(); renderDetail();
          toast("Specs importées avec succès.");
        }
      } catch (e) { toast("Fichier JSON invalide."); }
    };
    r.readAsText(file);
    this.value = "";
  });

  /* ---------- Démarrage ---------- */
  charger();
  renderStats(); renderFiltres(); renderListe();
  if (state.specs.length > 0) state.sel = state.specs[0].id;
  renderDetail();
})();
</script>
</body>
</html>
